<style>
/* Layout concept: cockpit de cuisine. Cartes douces sur fond crème, une barre d'onglets en bas sur téléphone, une barre en pilule en haut sur tablette. */

  --sage:#6FA57B;--on-sage:#0F1A12;--sage-ink:#A9D3B1;--sage-soft:#263528;
  --deep:#1F3226;--deep2:#2A4332;--deepink:#F2EEE2;--deepmute:#B5CDB8;
  --terra:#D9794F;--terra-soft:#43291D;--terra-ink:#F3C5AD;
  --ochre:#D4A63C;--ochre-soft:#3F3418;--ochre-ink:#EBCB82;
  --water:#6FA6BF;--water-soft:#233036;--track:#2C332D;--nav-bg:#232A25;--over:rgba(0,0,0,.6);--vio:#9B84DD;--vio-soft:#2D2840;--vio-ink:#CDBFF2;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141815;--card:#1D221E;--inset:#181D19;--line:#2C332D;--ink:#ECE8DD;--mute:#A7A396;

  --deep:#1F3226;--deep2:#2A4332;--deepink:#F2EEE2;--deepmute:#B5CDB8;
  --terra:#D9794F;--terra-soft:#43291D;--terra-ink:#F3C5AD;

*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--sage);outline-offset:2px}

.list>*{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}

.strip{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}

.rgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}

.input,select.input,textarea.input{width:100%;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--inset);font-size:16px}

.sheet{width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

 var W=318,H=100,n=items.length,bw=Math.min(34,Math.floor((W-(n-1)*8)/n)),gap=n>1?(W-n*bw)/(n-1):0;
 var s='<svg class="chart" viewBox="0 0 '+W+' '+(H+24)+'" role="img" aria-label="'+esc(label)+'"><line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"/>';
 if(goal!=null){var gy=H-Math.min(1,goal/max)*H;s+='<line x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'" stroke="'+color+'" stroke-width="1.5" stroke-dasharray="5 4"/>'}
 items.forEach(function(it,i){var x=i*(bw+gap),hv=it.v==null?0:Math.min(1,it.v/max)*H;
  s+='<rect x="'+x.toFixed(1)+'" y="'+(H-hv).toFixed(1)+'" width="'+bw+'" height="'+Math.max(hv,it.v==null?0:2).toFixed(1)+'" rx="7" fill="'+(it.hi?color:'color-mix(in srgb,'+color+' 55%,var(--card))')+'"><title>'+esc(it.t)+'</title></rect><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H+16)+'" text-anchor="middle" font-size="11" fill="var(--mute)" font-family="DM Sans, sans-serif"'+(it.hi?' font-weight="700"':'')+'>'+it.l+'</text>'});
 return s+'</svg>'
}
function lineChart(vals,labels,max,goal,color,label){
 var W=318,H=100,n=vals.length,pts=vals.map(function(v,i){return [n>1?12+i*(W-24)/(n-1):W/2,H-4-Math.min(1,v/max)*(H-12)]});
 var s='<svg class="chart" viewBox="0 0 '+W+' '+(H+24)+'" role="img" aria-label="'+esc(label)+'"><line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--line)"/>';
 if(goal>0){var gy=H-4-Math.min(1,goal/max)*(H-12);s+='<line x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'" stroke="'+color+'" stroke-width="1.5" stroke-dasharray="5 4"/>'}
 var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
 s+='<polygon points="'+pts[0][0].toFixed(1)+','+H+' '+line+' '+pts[n-1][0].toFixed(1)+','+H+'" fill="color-mix(in srgb,'+color+' 18%,transparent)"/><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
 pts.forEach(function(p,i){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="var(--card)" stroke="'+color+'" stroke-width="2.5"><title>'+esc(labels[i].t)+'</title></circle><text x="'+p[0].toFixed(1)+'" y="'+(H+16)+'" text-anchor="middle" font-size="11" fill="var(--mute)" font-family="DM Sans, sans-serif">'+labels[i].l+'</text>'});
 return s+'</svg>'
}

function toShop(name,qty,aisle,price,origin,nq,nu){
 var ex=S.shop.filter(function(x){return norm(x.name)===norm(name)&&!x.done})[0];if(ex)return false;
 var o={id:uid(),name:name,qty:qty,aisle:aisle,price:price,done:false,origin:origin};if(nq&&nu){o.nq=nq;o.nu=nu}S.shop.push(o);return true
}
function stockFind(n,u){return S.stock.filter(function(s){return norm(s.name)===norm(n)&&s.unit===u&&dToExp(s)>=0})[0]}
function parseQ(t){var m=/^\s*(\d+(?:[.,]\d+)?)\s*([a-zA-Zéèêûô]*)\s*$/.exec(t||'');if(!m)return null;var q=parseFloat(m[1].replace(',','.')),u=m[2].toLowerCase();
 if(!q)return null;if(u==='kg')return {q:q*1000,u:'g'};if(u==='g'||u==='gr')return {q:q,u:'g'};if(u==='l')return {q:q*1000,u:'ml'};if(u==='cl')return {q:q*10,u:'ml'};if(u==='ml')return {q:q,u:'ml'};
 if(u===''||/^pi[eè]ces?$|^pcs?$|^u$|^unit/.test(u))return {q:q,u:'pièces'};if(/^tranches?$/.test(u))return {q:q,u:'tranches'};return null}
function shopStock(x){if((!x.nq||!x.nu)&&!x.stocked){var pq=parseQ(x.qty);if(pq){x.nq=pq.q;x.nu=pq.u}}if(!x.nq||!x.nu)return;
 if(x.done&&!x.stocked){var st=stockFind(x.name,x.nu),sg=/surgel/i.test(x.name),dd=/saumon|cabillaud/i.test(x.name)?2:x.aisle===VP?3:x.aisle===CR?7:x.aisle===FL?6:/^(pain|wrap)/i.test(x.name)?5:0;
  if(st)st.qty=Math.round((st.qty+x.nq)*100)/100;else S.stock.push({id:uid(),name:x.name,loc:sg?'Congélo':x.aisle===EP?'Placard':'Frigo',qty:x.nq,unit:x.nu,bought:todayK(),exp:(sg||!dd)?'':addD(todayK(),dd),min:0});x.stocked=true}
 else if(!x.done&&x.stocked){var s2=stockFind(x.name,x.nu);if(s2){s2.qty=Math.max(0,Math.round((s2.qty-x.nq)*100)/100)}x.stocked=false}}
function eatStock(m){var r=mr(m);if(!r)return;
 if(m.eaten&&!m.ded){m.ded=[];r.ing.forEach(function(i){var st=stockFind(i.n,i.u);if(st){var a=Math.min(st.qty,i.q);st.qty=Math.round((st.qty-a)*100)/100;m.ded.push([i.n,i.u,a])}})}
 else if(!m.eaten&&m.ded){m.ded.forEach(function(d){var st=stockFind(d[0],d[1]);if(st)st.qty=Math.round((st.qty+d[2])*100)/100});delete m.ded}}
